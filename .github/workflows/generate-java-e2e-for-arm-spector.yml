name: Generate Java e2e test for ARM Spector

# Manually-dispatched workflow that, given an open ARM Spector PR in
# Azure/typespec-azure and optionally an open PR in this repo, generates
# (or updates) the corresponding Java e2e test cases under
# packages/http-client-java/generator/http-client-generator-test/.
#
# Required secrets (all already used by other workflows in this repo):
#   - COPILOT_GITHUB_TOKEN: token used by the GitHub Copilot CLI agent step.
#   - GH_AW_GITHUB_TOKEN (optional, falls back to GITHUB_TOKEN): used as GH_TOKEN
#     for `gh` calls and for pushing branches / opening PRs. For pushing into a
#     contributor's fork branch, GH_AW_GITHUB_TOKEN must have cross-repo write.

on:
  workflow_dispatch:
    inputs:
      typespec_azure_pr:
        description: "PR number or URL in Azure/typespec-azure that adds an ARM Spector test"
        required: true
        type: string
      typespec_pr:
        description: "Optional PR number or URL in this repo to push results into; leave blank to open a new PR"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate Java e2e test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # GH_TOKEN is intentionally NOT set at the job level. Steps that need it
      # supply it via env: so build/install steps that run untrusted Azure PR
      # code don't have access to a write-scoped token.
      AZURE_PR_INPUT: ${{ inputs.typespec_azure_pr }}
      TYPESPEC_PR_INPUT: ${{ inputs.typespec_pr }}

    steps:
      # ---------------------------------------------------------------------
      # 1) Checkout this repo (typespec) into ./typespec.
      #    If a typespec PR was provided, we'll `gh pr checkout` it below.
      # ---------------------------------------------------------------------
      - name: Checkout typespec
        uses: actions/checkout@v6
        with:
          path: typespec
          fetch-depth: 0
          # Keep credentials so we can push back to this repo.
          persist-credentials: true
          token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve PR inputs
        id: resolve
        working-directory: typespec
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Parses either a PR URL (https://github.com/<owner>/<repo>/pull/<n>) or
          # a bare PR number. For bare numbers we use $2 as the default repo slug.
          extract_pr() {
            local raw="$1"
            local default_repo="$2"
            if [[ -z "$raw" ]]; then
              echo "||"
              return
            fi
            if [[ "$raw" =~ ^https?://[^/]+/([^/]+)/([^/]+)/pull/([0-9]+) ]]; then
              echo "${BASH_REMATCH[1]}/${BASH_REMATCH[2]}|${BASH_REMATCH[3]}"
            elif [[ "$raw" =~ ^([0-9]+)$ ]]; then
              echo "${default_repo}|${BASH_REMATCH[1]}"
            else
              echo "::error::Could not parse PR reference '$raw'. Use a full URL or a bare number." >&2
              exit 1
            fi
          }

          IFS='|' read -r AZURE_REPO AZURE_PR    <<< "$(extract_pr "$AZURE_PR_INPUT"    'Azure/typespec-azure')"
          IFS='|' read -r TYPESPEC_REPO TYPESPEC_PR <<< "$(extract_pr "$TYPESPEC_PR_INPUT" "${{ github.repository }}")"

          if [[ -z "$AZURE_PR" ]]; then
            echo "::error::typespec_azure_pr is required"
            exit 1
          fi

          echo "azure_repo=$AZURE_REPO"          >> "$GITHUB_OUTPUT"
          echo "azure_pr=$AZURE_PR"              >> "$GITHUB_OUTPUT"
          echo "typespec_repo=$TYPESPEC_REPO"    >> "$GITHUB_OUTPUT"
          echo "typespec_pr=$TYPESPEC_PR"        >> "$GITHUB_OUTPUT"

          echo "Azure PR:    $AZURE_REPO#$AZURE_PR"
          if [[ -n "$TYPESPEC_PR" ]]; then
            echo "Typespec PR: $TYPESPEC_REPO#$TYPESPEC_PR"
          fi

          # If a typespec PR was supplied, refuse to push to a fork branch since
          # GITHUB_TOKEN / the default checkout token cannot write across repos.
          # Also refuse if the typespec PR is in a different repo than the one
          # the workflow is running in.
          if [[ -n "$TYPESPEC_PR" ]]; then
            if [[ "$TYPESPEC_REPO" != "${{ github.repository }}" ]]; then
              echo "::error::typespec PR $TYPESPEC_REPO#$TYPESPEC_PR is in a different repo than this workflow ('${{ github.repository }}'). Re-run the workflow from that repo, or omit typespec_pr."
              exit 1
            fi
            HEAD_REPO=$(gh pr view "$TYPESPEC_PR" --repo "${{ github.repository }}" --json headRepositoryOwner -q .headRepositoryOwner.login)
            if [[ "$HEAD_REPO" != "${{ github.repository_owner }}" ]]; then
              echo "::error::typespec PR #$TYPESPEC_PR is from fork '$HEAD_REPO'. Pushing across repos is not supported. Re-run without typespec_pr to open a new PR in this repo."
              exit 1
            fi
          fi

      - name: Checkout typespec PR branch (if provided)
        if: steps.resolve.outputs.typespec_pr != ''
        working-directory: typespec
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr checkout "${{ steps.resolve.outputs.typespec_pr }}" --repo "${{ github.repository }}"
          echo "Checked out typespec PR #${{ steps.resolve.outputs.typespec_pr }} on branch $(git rev-parse --abbrev-ref HEAD)"

      - name: Create working branch (no typespec PR provided)
        if: steps.resolve.outputs.typespec_pr == ''
        working-directory: typespec
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="auto/java-e2e-arm-${{ steps.resolve.outputs.azure_pr }}-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          echo "Created branch $BRANCH"
          echo "WORK_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # 2) Toolchain.
      # ---------------------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: typespec/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Install root workspace deps; required by `npm run format` (which calls
      # `pnpm -w format:dir`) and by `pnpm change add` (Chronus).
      # http-client-java is excluded from pnpm-workspace.yaml so this does not
      # interfere with the later `npm ci` inside that package.
      - name: pnpm install (typespec workspace root)
        working-directory: typespec
        run: pnpm install

      # ---------------------------------------------------------------------
      # 3) Clone typespec-azure as a sibling and check out the Azure PR.
      # ---------------------------------------------------------------------
      - name: Clone typespec-azure & checkout PR
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Use a full clone (no --depth) so `gh pr checkout` can set up branch
          # tracking; shallow clones break the refspec it needs.
          gh repo clone "${{ steps.resolve.outputs.azure_repo }}" typespec-azure
          cd typespec-azure
          gh pr checkout "${{ steps.resolve.outputs.azure_pr }}" --repo "${{ steps.resolve.outputs.azure_repo }}"
          # typespec-azure references @typespec/compiler@workspace:^ via the
          # `core/` git submodule pointing at microsoft/typespec. Initialize it
          # so the pnpm workspace can resolve its own dependencies.
          git submodule update --init --recursive
          echo "Azure PR head: $(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD)"

      # ---------------------------------------------------------------------
      # 3a) Build typespec-azure's azure-http-specs so that the PR's
      #     mockapi.ts files exist as compiled mockapi.js under
      #     packages/azure-http-specs/dist/specs/. Spector serves mocks from
      #     ../dist/**/*.js relative to the scenarios path (see
      #     @typespec/spector scenarios-resolver.ts), NOT from the .ts
      #     sources. Without this build, `npm run spector-start` later in
      #     this workflow would (a) serve no routes at all for ARM
      #     scenarios newly added by the PR, and (b) serve stale mocks
      #     from the pinned alpha tarball for modified scenarios.
      #
      #     We invoke `tsc -p ./tsconfig.build.json` directly instead of
      #     `pnpm --filter @azure-tools/azure-http-specs build` because the
      #     latter chains `pnpm validate-scenarios`, which may abort on
      #     intentional new features in the PR.
      # ---------------------------------------------------------------------
      - name: Build azure-http-specs in typespec-azure (compile mockapi.ts)
        working-directory: typespec-azure
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile=false
          # Build workspace dependencies of azure-http-specs (notably
          # @typespec/spec-api from the core/ submodule) so their dist/*.d.ts
          # files exist and tsc can resolve them from mockapi.ts. We use the
          # `^...` filter to build dependencies only, NOT the package itself,
          # because building @azure-tools/azure-http-specs chains
          # `validate-scenarios` which can abort on intentional PR features.
          pnpm --filter "@azure-tools/azure-http-specs^..." build
          pnpm --filter @azure-tools/azure-http-specs exec tsc -p ./tsconfig.build.json

      # ---------------------------------------------------------------------
      # 4) Detect changed ARM scenarios in the Azure PR (must run before we
      #    rewrite anything so the diff is clean).
      # ---------------------------------------------------------------------
      - name: Detect changed ARM scenarios
        id: scenarios
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $json = & "${{ github.workspace }}/typespec/eng/scripts/Get-ChangedArmSpectorScenarios.ps1" `
            -PrNumber "${{ steps.resolve.outputs.azure_pr }}" `
            -RepoSlug "${{ steps.resolve.outputs.azure_repo }}" `
            -TypespecAzureRoot "${{ github.workspace }}/typespec-azure"
          Write-Host "Scenarios JSON: $json"
          "scenarios_json=$json" >> $env:GITHUB_OUTPUT
          # Build a multi-line list for the prompt template.
          $items = $json | ConvertFrom-Json
          if ($items -isnot [System.Array]) { $items = @($items) }
          $list = ($items | ForEach-Object { "- $_" }) -join "`n"
          "scenarios_list<<EOF" >> $env:GITHUB_OUTPUT
          $list                  >> $env:GITHUB_OUTPUT
          "EOF"                  >> $env:GITHUB_OUTPUT

      - name: Fail if no ARM scenarios changed
        if: steps.scenarios.outputs.scenarios_json == '[]'
        shell: bash
        run: |
          echo "::error::PR ${{ steps.resolve.outputs.azure_repo }}#${{ steps.resolve.outputs.azure_pr }} does not change any files under packages/azure-http-specs/specs/azure/resource-manager/**"
          exit 1

      # ---------------------------------------------------------------------
      # 5) Setup the http-client-java emitter (builds + npm pack + installs
      #    upstream @azure-tools/azure-http-specs into the test project).
      #    We deliberately do NOT pack azure-http-specs from typespec-azure.
      #    The typespec-azure PR is usually based on an older release of
      #    typespec-azure than what http-client-generator-test pins (newer
      #    typespec compiler / resource-manager). Swapping the whole tarball
      #    causes (a) downgraded peer types to break unrelated tsp/*.tsp tests
      #    and (b) missing scenarios that the upstream pinned version expects
      #    (e.g. multi-service/client.tsp referenced unconditionally by
      #    Generate.ps1). Instead, we let Setup.ps1 install the pinned upstream
      #    azure-http-specs, then overlay just the PR's changed ARM scenario
      #    files into node_modules before compiling those scenarios.
      # ---------------------------------------------------------------------
      - name: Run Setup.ps1
        working-directory: typespec/packages/http-client-java/generator/http-client-generator-test
        shell: pwsh
        run: ./Setup.ps1

      # ---------------------------------------------------------------------
      # 6) Overlay the PR's changed ARM scenario tsp files into the test
      #    project's installed @azure-tools/azure-http-specs so that the
      #    compiled spec sees the PR's additions/modifications.
      # ---------------------------------------------------------------------
      - name: Overlay PR ARM scenarios into node_modules
        id: overlay
        shell: pwsh
        env:
          SCENARIOS_JSON: ${{ steps.scenarios.outputs.scenarios_json }}
        run: |
          $ErrorActionPreference = "Stop"
          $tsazSpecRoot = "${{ github.workspace }}/typespec-azure/packages/azure-http-specs/specs"
          $tsazDistRoot = "${{ github.workspace }}/typespec-azure/packages/azure-http-specs/dist/specs"
          $nmSpecRoot   = "${{ github.workspace }}/typespec/packages/http-client-java/generator/http-client-generator-test/node_modules/@azure-tools/azure-http-specs/specs"
          $nmDistRoot   = "${{ github.workspace }}/typespec/packages/http-client-java/generator/http-client-generator-test/node_modules/@azure-tools/azure-http-specs/dist/specs"
          if (-not (Test-Path $nmSpecRoot)) { throw "node_modules azure-http-specs/specs not found at $nmSpecRoot" }
          if (-not (Test-Path $nmDistRoot)) { throw "node_modules azure-http-specs/dist/specs not found at $nmDistRoot" }
          $scenarios = $env:SCENARIOS_JSON | ConvertFrom-Json
          if ($scenarios -isnot [System.Array]) { $scenarios = @($scenarios) }
          $mainTspList = @()
          foreach ($scenarioRel in $scenarios) {
            # scenarioRel comes from Get-ChangedArmSpectorScenarios.ps1 as the path
            # relative to the typespec-azure repo root, e.g.
            #   packages/azure-http-specs/specs/azure/resource-manager/common-properties
            # We need the path relative to packages/azure-http-specs/ (e.g. "specs/...")
            # to map it under the test project's node_modules/@azure-tools/azure-http-specs/.
            $rel = $scenarioRel -replace '^packages/azure-http-specs/specs/', ''
            $src = Join-Path $tsazSpecRoot $rel
            $dst = Join-Path $nmSpecRoot   $rel
            if (-not (Test-Path $src)) { throw "Scenario source not found: $src" }
            New-Item -ItemType Directory -Force -Path (Split-Path $dst -Parent) | Out-Null
            if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
            Copy-Item -Recurse -Force $src $dst
            Write-Host "Overlaid specs $src -> $dst"
            $mainTsp = Join-Path $dst "main.tsp"
            if (Test-Path $mainTsp) { $mainTspList += $mainTsp }

            # Also overlay the compiled mockapi.js (and any sibling .js) into
            # node_modules dist/ so that `npm run spector-start` serves the
            # PR's mocks, not the pinned alpha tarball's. The build step
            # earlier in this workflow (`pnpm exec tsc -p tsconfig.build.json`
            # in typespec-azure) populated $tsazDistRoot.
            $srcJs = Join-Path $tsazDistRoot $rel
            $dstJs = Join-Path $nmDistRoot   $rel
            if (-not (Test-Path $srcJs)) {
              Write-Host "::warning::No compiled dist for scenario '$rel' at $srcJs; spector will serve no routes for it. Did the azure-http-specs build skip this folder?"
            } else {
              New-Item -ItemType Directory -Force -Path (Split-Path $dstJs -Parent) | Out-Null
              if (Test-Path $dstJs) { Remove-Item -Recurse -Force $dstJs }
              Copy-Item -Recurse -Force $srcJs $dstJs
              Write-Host "Overlaid compiled mocks $srcJs -> $dstJs"
            }
          }
          if ($mainTspList.Count -eq 0) { throw "No main.tsp files found in overlaid scenarios" }
          "main_tsps<<EOF" >> $env:GITHUB_OUTPUT
          ($mainTspList -join "`n") >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------------------------------
      # 7) Run tsp compile on each PR-affected scenario's main.tsp and copy
      #    the generated Java sources into src/.
      # ---------------------------------------------------------------------
      - name: Compile PR ARM scenarios with http-client-java emitter
        working-directory: typespec/packages/http-client-java/generator/http-client-generator-test
        shell: pwsh
        env:
          MAIN_TSPS: ${{ steps.overlay.outputs.main_tsps }}
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path ./tsp-output) { Remove-Item ./tsp-output -Recurse -Force }
          $outRoot = (Resolve-Path .).Path + "/tsp-output"
          New-Item -ItemType Directory -Force -Path $outRoot | Out-Null
          $tsps = ($env:MAIN_TSPS -split "`r?`n") | Where-Object { $_ -ne "" }
          $failed = @()
          foreach ($tsp in $tsps) {
            # Prefer client.tsp if it exists alongside main.tsp (mirrors Generate.ps1 behavior).
            $clientTsp = $tsp -replace 'main\.tsp$', 'client.tsp'
            $compileSource = if (Test-Path $clientTsp) { $clientTsp } else { $tsp }
            $outName = "pr-overlay-$([guid]::NewGuid().ToString('N'))"
            $outAbs  = Join-Path $outRoot $outName
            Write-Host "Compiling $compileSource -> $outAbs"
            # NOTE: We cannot use {project-root} here because for tsp files inside
            # node_modules, project-root resolves to the package's own directory,
            # not the test project. Use the absolute path of our intended output dir.
            & npx --no tsp compile $compileSource `
              --emit "@typespec/http-client-java" `
              --option "@typespec/http-client-java.emitter-output-dir=$outAbs"
            if ($LASTEXITCODE -ne 0) { $failed += $compileSource }
          }
          if ($failed.Count -gt 0) {
            throw "tsp compile failed for: $($failed -join ', ')"
          }
          # Merge each tsp-output/<id>/src into the test project's src/.
          # NOTE: We exclude module-info.java and ReadmeSamples.java to match
          # the manual regen path (Generate.ps1). The emitter produces a
          # per-scenario module-info.java at src/main/java/module-info.java
          # that, if merged, breaks `mvn test-compile` because it doesn't
          # declare the modules of the other scenarios already in ./src.
          # PowerShell's `Copy-Item -Recurse -Exclude` only filters items
          # matched directly by -Path, so it does NOT reliably exclude these
          # nested files. The -Exclude below mirrors Generate.ps1 for parity;
          # the Get-ChildItem | Remove-Item pass after the loop is what
          # actually guarantees the cleanup.
          Get-ChildItem -Path ./tsp-output -Directory | ForEach-Object {
            $srcSub = Join-Path $_.FullName "src"
            if (Test-Path $srcSub) {
              Write-Host "Merging $srcSub -> ./src"
              if (-not (Test-Path ./src)) { New-Item -ItemType Directory -Path ./src | Out-Null }
              Copy-Item -Path "$srcSub/*" -Destination ./src -Recurse -Force `
                -Exclude @("ReadmeSamples.java", "module-info.java")
            }
          }
          Get-ChildItem -Path ./src -Recurse -File `
            -Include 'module-info.java','ReadmeSamples.java' `
            -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Removing leaked generated file: $($_.FullName)"
              Remove-Item -Force $_.FullName
            }
          Remove-Item -Recurse -Force ./tsp-output

      # ---------------------------------------------------------------------
      # 9) Build the prompt and invoke the Copilot CLI agent to write the test.
      # ---------------------------------------------------------------------
      - name: Build agent prompt
        id: prompt
        shell: bash
        env:
          SCENARIO_LIST: ${{ steps.scenarios.outputs.scenarios_list }}
          AZURE_REPO: ${{ steps.resolve.outputs.azure_repo }}
          AZURE_PR: ${{ steps.resolve.outputs.azure_pr }}
          TYPESPEC_PR: ${{ steps.resolve.outputs.typespec_pr }}
          REPO_FULL: ${{ github.repository }}
          WORKSPACE: ${{ github.workspace }}
          PROMPT_OUT: ${{ runner.temp }}/agent-prompt.md
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          template = Path("typespec/.github/copilot-prompts/java-e2e-arm-spector.md").read_text()
          rendered = template.replace("{{SCENARIO_LIST}}", os.environ["SCENARIO_LIST"])

          azure_repo  = os.environ["AZURE_REPO"]
          azure_pr    = os.environ["AZURE_PR"]
          typespec_pr = os.environ.get("TYPESPEC_PR", "")
          repo        = os.environ["REPO_FULL"]
          ws          = os.environ["WORKSPACE"]

          rendered += "\n\n## Trigger context\n\n"
          rendered += f"- typespec-azure PR: https://github.com/{azure_repo}/pull/{azure_pr}\n"
          if typespec_pr:
              rendered += f"- typespec PR (target): https://github.com/{repo}/pull/{typespec_pr}\n"
          rendered += f"- typespec checkout: `{ws}/typespec`\n"
          rendered += f"- typespec-azure checkout: `{ws}/typespec-azure`\n"

          out = Path(os.environ["PROMPT_OUT"])
          out.write_text(rendered)
          PY
          echo "prompt_file=${PROMPT_OUT}" >> "$GITHUB_OUTPUT"
          echo "----- Rendered prompt -----"
          cat "$PROMPT_OUT"
          echo "----- /Rendered prompt -----"

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot@latest

      - name: Run Copilot CLI agent (with retry on mvn failure)
        id: agent
        working-directory: typespec
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=3
          PROMPT_FILE='${{ steps.prompt.outputs.prompt_file }}'
          TESTDIR="packages/http-client-java/generator/http-client-generator-test"
          FEEDBACK_FILE="${RUNNER_TEMP}/agent-feedback.txt"
          : > "$FEEDBACK_FILE"
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "===== Agent attempt $attempt/$MAX_ATTEMPTS ====="
            CURRENT_PROMPT_FILE="${RUNNER_TEMP}/agent-prompt-$attempt.md"
            cp "$PROMPT_FILE" "$CURRENT_PROMPT_FILE"
            if [[ -s "$FEEDBACK_FILE" ]]; then
              {
                echo ""
                echo "## Previous attempt failed"
                echo ""
                echo "The Java test you wrote in the previous turn failed to build/run."
                echo "Below is the relevant compiler/test output. Inspect the actual"
                echo "generated sources under $TESTDIR/src/main/java/ to find correct"
                echo "import paths and types, then fix only the test file(s) you authored."
                echo ""
                echo '```'
                cat "$FEEDBACK_FILE"
                echo '```'
              } >> "$CURRENT_PROMPT_FILE"
            fi
            copilot \
              --no-color \
              --add-dir "${{ github.workspace }}" \
              --add-dir "${{ github.workspace }}/typespec-azure" \
              --allow-all-tools \
              -p "$(cat "$CURRENT_PROMPT_FILE")" \
              | tee "${RUNNER_TEMP}/copilot-output-$attempt.log"

            set +e
            ( cd "$TESTDIR" && mvn -B -ntp clean test-compile ) > "${RUNNER_TEMP}/mvn-compile-$attempt.log" 2>&1
            COMPILE_RC=$?
            set -e
            if [[ $COMPILE_RC -ne 0 ]]; then
              echo "mvn test-compile failed on attempt $attempt; feeding output back to agent"
              tail -c 8000 "${RUNNER_TEMP}/mvn-compile-$attempt.log" > "$FEEDBACK_FILE"
              continue
            fi

            ( cd "$TESTDIR" && npm run spector-start ) &
            SPECTOR_PID=$!
            sleep 5

            # Scope mvn test to ONLY the new/modified test classes the agent
            # wrote this run. Running the whole test suite produces many
            # unrelated module-path failures that are not in scope.
            # Use --untracked-files=all so a new .java file inside a brand-new
            # untracked directory is listed individually (otherwise git only
            # reports the directory itself, which doesn't match \.java$). Wrap
            # grep in `|| true` so an empty match doesn't trip pipefail+set -e
            # and silently kill the script before mvn test even runs.
            NEW_TESTS=$(git status --porcelain --untracked-files=all -- "$TESTDIR/src/test/java/" \
              | awk '{print $NF}' \
              | { grep -E '\.java$' || true; } \
              | sed -E "s|^$TESTDIR/src/test/java/||; s|\.java$||; s|/|.|g" \
              | paste -sd, -)
            if [[ -z "$NEW_TESTS" ]]; then
              echo "::warning::No new/modified test classes detected under $TESTDIR/src/test/java/"
              TEST_ARG=""
            else
              echo "Running scoped tests: $NEW_TESTS"
              TEST_ARG="-Dtest=$NEW_TESTS -DfailIfNoTests=false"
            fi

            set +e
            ( cd "$TESTDIR" && mvn -B -ntp test $TEST_ARG ) > "${RUNNER_TEMP}/mvn-test-$attempt.log" 2>&1
            TEST_RC=$?
            set -e

            ( cd "$TESTDIR" && npm run spector-stop ) || true
            wait $SPECTOR_PID 2>/dev/null || true

            if [[ $TEST_RC -eq 0 ]]; then
              echo "===== Agent succeeded on attempt $attempt ====="
              echo "attempts=$attempt" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "mvn test failed on attempt $attempt; feeding output back to agent"
            tail -c 8000 "${RUNNER_TEMP}/mvn-test-$attempt.log" > "$FEEDBACK_FILE"
          done
          echo "::error::Agent failed to produce passing tests after $MAX_ATTEMPTS attempts"
          echo "----- Last mvn output -----"
          tail -c 8000 "${RUNNER_TEMP}/mvn-test-$MAX_ATTEMPTS.log" 2>/dev/null || \
            tail -c 8000 "${RUNNER_TEMP}/mvn-compile-$MAX_ATTEMPTS.log" 2>/dev/null || true
          exit 1

      - name: Guard against unauthorized edits
        working-directory: typespec
        shell: bash
        run: |
          set -euo pipefail
          # Allowed: regenerated sources (src/main/java) and agent-authored tests (src/test/java).
          # We no longer patch package.json, so it must not appear in the diff.
          ALLOWED_REGEX='^packages/http-client-java/generator/http-client-generator-test/src/(test|main)/java/|^packages/http-client-java/generator/http-client-generator-test/src/main/resources/'
          UNEXPECTED=$(git status --porcelain | awk '{print $2}' | grep -Ev "$ALLOWED_REGEX" || true)
          if [[ -n "$UNEXPECTED" ]]; then
            echo "::error::Copilot agent (or regen) touched files outside the allowlist:"
            echo "$UNEXPECTED"
            exit 1
          fi

      # ---------------------------------------------------------------------
      # 11) Stage only allowed changes.
      # ---------------------------------------------------------------------
      - name: Format http-client-java Java sources
        working-directory: typespec/packages/http-client-java
        # The agent only authors Java test files, so only Java formatting
        # (mvn spotless:apply) needs to run. We skip `npm run format`
        # because it also runs prettier, which depends on a built
        # `prettier-plugin-typespec/dist/` that this workflow doesn't build.
        run: mvn spotless:apply --no-transfer-progress -T 1C --activate-profiles test -f ./generator/pom.xml

      - name: Add chronus changelog entry
        working-directory: typespec
        shell: bash
        run: |
          set -euo pipefail
          MSG="Add Java e2e test for ARM Spector scenarios (${{ steps.resolve.outputs.azure_repo }}#${{ steps.resolve.outputs.azure_pr }})"
          pnpm change add @typespec/http-client-java --kind=internal --message="$MSG"

      - name: Configure git identity
        working-directory: typespec
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

      - name: Commit allowed changes
        working-directory: typespec
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add \
            "packages/http-client-java/generator/http-client-generator-test/src/test/java" \
            "packages/http-client-java/generator/http-client-generator-test/src/main/java" \
            ".chronus" || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add Java e2e test for ARM Spector scenarios (${{ steps.resolve.outputs.azure_repo }}#${{ steps.resolve.outputs.azure_pr }})

          Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # 12) Publish results.
      # ---------------------------------------------------------------------
      - name: Push to existing typespec PR branch
        if: steps.commit.outputs.has_changes == 'true' && steps.resolve.outputs.typespec_pr != ''
        working-directory: typespec
        shell: bash
        run: |
          set -euo pipefail
          # `gh pr checkout` set up a branch tracking the PR head; push to it.
          git push

      - name: Comment on typespec PR
        if: steps.commit.outputs.has_changes == 'true' && steps.resolve.outputs.typespec_pr != ''
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh pr comment "${{ steps.resolve.outputs.typespec_pr }}" \
            --repo "${{ github.repository }}" \
            --body "Pushed generated Java e2e tests for ${{ steps.resolve.outputs.azure_repo }}#${{ steps.resolve.outputs.azure_pr }} (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."

      - name: Push new branch and open PR
        if: steps.commit.outputs.has_changes == 'true' && steps.resolve.outputs.typespec_pr == ''
        working-directory: typespec
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git push --set-upstream origin "$WORK_BRANCH"
          BODY="Auto-generated by [Generate Java e2e test for ARM Spector](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          Linked to ${{ steps.resolve.outputs.azure_repo }}#${{ steps.resolve.outputs.azure_pr }}."
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$WORK_BRANCH" \
            --title "Java e2e test for ARM Spector (${{ steps.resolve.outputs.azure_repo }}#${{ steps.resolve.outputs.azure_pr }})" \
            --body "$BODY"

      # ---------------------------------------------------------------------
      # 13) Failure artifacts.
      # ---------------------------------------------------------------------
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: generate-java-e2e-debug-${{ github.run_id }}
          path: |
            typespec/packages/http-client-java/generator/http-client-generator-test/target/surefire-reports/**
            typespec/packages/http-client-java/generator/http-client-generator-test/tsp-spector-coverage-*.json
            ${{ runner.temp }}/copilot-output.log
            ${{ runner.temp }}/agent-prompt.md
          if-no-files-found: ignore
